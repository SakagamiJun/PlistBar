name: Release & Update Homebrew Cask

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Release & Update Cask
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing release for version: ${VERSION} (${TAG_NAME})"

      - name: Build Application Bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Package App Bundle into ZIP
        id: package
        run: |
          # Use ditto to preserve macOS metadata, permissions, and symlinks
          ditto -c -k --sequesterRsrc --keepParent build/PlistBar.app PlistBar.zip
          SHA256=$(shasum -a 256 PlistBar.zip | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "Generated PlistBar.zip with SHA256: ${SHA256}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PlistBar ${{ steps.version.outputs.tag }}
          files: PlistBar.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Cask (Personal Tap)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_TOKEN || secrets.GH_PAT }}
          TAP_REPO: "SakagamiJun/homebrew-tap"
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          CASK_CONTENT=$(cat <<END_CASK
cask "plistbar" do
  version "${VERSION}"
  sha256 "${SHA256}"

  url "https://github.com/SakagamiJun/PlistBar/releases/download/v#{version}/PlistBar.zip"
  name "PlistBar"
  desc "Lightweight launchd manager with memory safety"
  homepage "https://github.com/SakagamiJun/PlistBar"

  depends_on macos: ">= :sonoma"

  app "PlistBar.app"

  zap trash: [
    "~/Library/Application Support/com.sakagamijun.PlistBar",
    "~/Library/Preferences/com.sakagamijun.PlistBar.plist",
  ]
end
END_CASK
          )

          if [ -z "$TAP_TOKEN" ]; then
            echo "⚠️ HOMEBREW_TAP_TOKEN is not configured in repository secrets."
            echo "To automatically update your tap repository (${TAP_REPO}), add a Personal Access Token (PAT) with repo scope named 'HOMEBREW_TAP_TOKEN'."
            echo ""
            echo "Cask definition for Casks/plistbar.rb in ${TAP_REPO}:"
            echo "----------------------------------------"
            echo "$CASK_CONTENT"
            echo "----------------------------------------"
            exit 0
          fi

          echo "Cloning tap repository: ${TAP_REPO}..."
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap_repo
          cd tap_repo
          mkdir -p Casks
          echo "$CASK_CONTENT" > Casks/plistbar.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/plistbar.rb

          if git diff --staged --quiet; then
            echo "No changes detected in Casks/plistbar.rb"
          else
            git commit -m "chore(cask): update plistbar to v${VERSION}"
            git push origin HEAD:main
            echo "✅ Successfully updated Casks/plistbar.rb in ${TAP_REPO} to v${VERSION}!"
          fi
